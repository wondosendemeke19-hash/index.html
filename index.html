<section id="authView" class="panel auth text-center">
  <h1>Welcome to BOOK GAME</h1>
  <p class="muted">Connecting securely through your Telegram account...</p>
  
  <div class="spinner-box" style="margin: 20px 0;">
    <div class="gameicon" style="animation: pulse 1s infinite;">📱</div>
  </div>

  <!-- Manual phone prompt if Telegram contact sharing is triggered -->
  <div id="phonePromptContainer" class="hidden">
    <p>Please share your phone number to complete your registration:</p>
    <button id="shareContactBtn" class="primary full" type="button" style="margin-top: 10px;">
      Share Telegram Contact 📞
    </button>
  </div>

  <p id="authMessage" class="message"></p>
</section>
